<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Partículas que imitam sua mão v5</title>
<style>
  body{margin:0;overflow:hidden;background:#05070f;font-family:system-ui,sans-serif}
  #gl{position:fixed;inset:0;width:100vw;height:100vh}
  #cam{position:fixed;right:12px;bottom:12px;width:160px;border-radius:12px;
       transform:scaleX(-1);opacity:.85;border:1px solid #23405c}
  #gesture{position:fixed;top:16px;left:20px;color:#9fffc8;font:600 22px/1.3 system-ui;
           text-shadow:0 0 14px #2fae7a}
  #hint{position:fixed;top:52px;left:20px;color:#8ea0c0;font:400 12px/1.5 system-ui;max-width:60vw}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<video id="cam" autoplay playsinline muted></video>
<div id="gesture">iniciando…</div>
<div id="hint">As partículas imitam seu gesto (✊ ✋ ️ 🤘 ☝️…), sempre no centro da tela.
Teclas 1–5: formações clássicas · 6: volta ao modo imitação.</div>

<script type="module">
import { FilesetResolver, HandLandmarker } from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const TAU=Math.PI*2, wrap01=v=>v-Math.floor(v), clamp=(v,a,b)=>Math.min(Math.max(v,a),b);
const canvas=document.getElementById('gl'), ctx=canvas.getContext('2d');
const video=document.getElementById('cam'), hud=document.getElementById('gesture');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio,2);W=innerWidth;H=innerHeight;
  canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);}
resize(); addEventListener('resize',resize);

/* ---------- geometria da mão ---------- */
const BONES=[]; const addBone=(a,b,tip)=>BONES.push({a,b,tip});
addBone(0,1,0);addBone(1,2,0);addBone(2,3,0);addBone(3,4,1);
for(const b of [5,9,13,17]){addBone(b,b+1,0);addBone(b+1,b+2,0);addBone(b+2,b+3,1);}
const TRIS=[[0,5,9],[0,9,13],[0,13,17]];

/* ---------- partículas ---------- */
const N=1800,P=[];
for(let i=0;i<N;i++){
  const base={ph:Math.random()*TAU,u1:Math.random(),u2:Math.random(),u3:Math.random(),
    sp:.6+Math.random()*.9,hue:Math.random()<.75?95+Math.random()*60:45+Math.random()*10,
    lw:1+Math.random()*1.6,x:W/2,y:H/2,ox:W/2,oy:H/2,tip:false};
  if(Math.random()<.35){
    const r1=Math.random(),r2=Math.random(),su=Math.sqrt(r1);
    Object.assign(base,{type:0,tri:(Math.random()*3)|0,bu:1-su,bv:r2*su,bw:su-r2*su});
  } else {
    const seg=BONES[(Math.random()*BONES.length)|0];
    Object.assign(base,{type:1,seg,t0:Math.random(),flow:.03+Math.random()*.05,
      rad:Math.random()*2-1});
  }
  P.push(base);
}
const stars=Array.from({length:120},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.2+.3}));

/* ---------- estado ---------- */
let mode='mirror',mirrorAuto=true,gestureName=null,cand=null,candCount=0;
let autoCycle=false,cycleIdx=0,nextCycle=0;
let cx=W/2,cy=H*.45,tcx=cx,tcy=cy,camOK=false,hand=null,SL=null,lastW=10,lastSeen=0;
const cycle=['open','two','fist','rock','point'];
const GN={open:'✋ mão aberta',two:'✌️ dois dedos',fist:'✊ punho',rock:'🤘 chifres',point:'☝️ indicador'};
const LABEL={open:'✋ mão aberta — explosão radial',two:'✌️ dois dedos — dispersão',
  fist:'✊ punho — esfera comprimida',rock:'🤘 chifres — chuva de espadas',
  point:'☝️ indicador — onda horizontal'};

function classify(lm){
  const d=(a,b)=>Math.hypot(lm[a].x-lm[b].x,lm[a].y-lm[b].y);
  const ext=(tip,pip)=>d(tip,0)>d(pip,0)*1.08;
  const I=ext(8,6),M=ext(12,10),R=ext(16,14),Pk=ext(20,18),cnt=I+M+R+Pk;
  if(I&&M&&!R&&!Pk)return 'two';
  if(I&&Pk&&!M&&!R)return 'rock';
  if(cnt>=4)return 'open';
  if(I&&!M&&!R&&!Pk)return 'point';
  if(cnt===0)return 'fist';
  return null;
}

(async()=>{ try{
  const stream=await navigator.mediaDevices.getUserMedia({video:{width:640,height:480,facingMode:'user'}});
  video.srcObject=stream; await video.play(); camOK=true;
  const vision=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm");
  hand=await HandLandmarker.createFromOptions(vision,{baseOptions:{
    modelAssetPath:"https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
    delegate:"GPU"},runningMode:"VIDEO",numHands:1});
}catch(e){ autoCycle=true; mirrorAuto=false; mode='open'; } })();

addEventListener('keydown',e=>{
  const m={'1':'open','2':'two','3':'fist','4':'rock','5':'point'}[e.key];
  if(m){mode=m;mirrorAuto=false;autoCycle=false;}
  if(e.key==='6'||e.key==='0'){mode='mirror';mirrorAuto=true;autoCycle=false;}
});

/* ---------- formações clássicas ---------- */
function target(p,t,out){
  const R=Math.min(W,H)*.30;
  if(mode==='two'){const xx=wrap01(p.u1+t*.03*p.sp);
    out.x=cx+(xx-.5)*W*.9;out.y=cy+(p.u2-.5)*H*.10+Math.sin(xx*7+t)*16;}
  else if(mode==='fist'){const a=p.u2*TAU+t*(1.2+p.u3*1.5),r=R*.62*Math.sqrt(p.u1);
    out.x=cx+Math.cos(a)*r;out.y=cy+Math.sin(a)*r;}
  else if(mode==='point'){out.x=cx+(p.u1-.5)*W*.8;
    out.y=cy+Math.sin(out.x*.012+t*2.2)*(28+40*p.u3)+(p.u2-.5)*14;}
  else if(mode==='rock'){out.x=cx+(p.u1-.5)*W*.85;out.y=wrap01(p.u2+t*.22*p.sp)*H;}
  else{const a=p.u2*TAU+t*.25+p.u3*.5,r=R*(.45+.55*p.u1)+Math.sin(t*2+p.u3*9)*10;
    out.x=cx+Math.cos(a)*r;out.y=cy+Math.sin(a)*r;}
}

/* ---------- loop ---------- */
const tgt={x:0,y:0}; let lastHud='';
function frame(now){ requestAnimationFrame(frame); const t=now/1000;
  const MCX=W/2, MCY=H*.46;                 // centro FIXO e seguro do modo imitação

  let detected=false;
  if(camOK&&hand&&video.readyState>=2){
    const res=hand.detectForVideo(video,now);
    if(res.landmarks?.length){ detected=true; lastSeen=now; const lm=res.landmarks[0];
      if(mirrorAuto) mode='mirror';
      const g=classify(lm);
      if(g){ candCount=(g===cand)?candCount+1:1; cand=g;
        if(candCount>=3){ gestureName=g; if(mode!=='mirror') mode=g; } }
      let px=0,py=0; for(const i of [0,5,9,13,17]){px+=lm[i].x;py+=lm[i].y;}
      /* presets seguem a mão, mas dentro de área segura */
      tcx=clamp((1-px/5)*W, W*.30, W*.70);
      tcy=clamp(( py/5)*H, H*.32, H*.68);
      /* silhueta p/ imitação: sempre centrada em (MCX,MCY) */
      const AR=(video.videoWidth/video.height)||4/3;
      let x0=9,x1=0,y0=9,y1=0;
      for(const q of lm){const X=q.x*AR;x0=Math.min(x0,X);x1=Math.max(x1,X);
                         y0=Math.min(y0,q.y);y1=Math.max(y1,q.y);}
      const dim=Math.max(x1-x0,y1-y0,0.28);
      const S=Math.min(W,H)*.62/dim, mx=(x0+x1)/2, my=(y0+y1)/2;
      lastW=clamp(S*0.03,3,16);
      const fresh=lm.map(q=>({x:MCX-(q.x*AR-mx)*S, y:MCY+(q.y-my)*S}));
      const ok=fresh.every(q=>Number.isFinite(q.x)&&Number.isFinite(q.y));
      if(ok){ if(!SL) SL=fresh;
        else SL.forEach((q,i)=>{q.x+=(fresh[i].x-q.x)*.4;q.y+=(fresh[i].y-q.y)*.4;}); }
    }
  }
  if(!detected){ tcx=W/2; tcy=H*.45;
    if(autoCycle&&now>nextCycle){nextCycle=now+5000;mode=cycle[cycleIdx++%5];}
    if(camOK&&mirrorAuto&&lastSeen&&now-lastSeen>6000){mode='open';gestureName=null;}
  }
  cx+=(tcx-cx)*.12; cy+=(tcy-cy)*.12;

  ctx.globalCompositeOperation='source-over';
  ctx.fillStyle='rgba(3,6,16,.30)'; ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  ctx.fillStyle='rgba(200,220,255,.05)';
  for(const s of stars){ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,TAU);ctx.fill();}

  if(mode==='rock'){ctx.strokeStyle='rgba(255,215,150,.35)';ctx.lineWidth=5;
    ctx.shadowBlur=25;ctx.shadowColor='#fc9';ctx.beginPath();
    ctx.ellipse(cx,H*.10,Math.min(W,H)*.28,Math.min(W,H)*.07,0,0,TAU);
    ctx.stroke();ctx.shadowBlur=0;}

  const mirror=mode==='mirror'&&SL;
  const k=mirror?.22:.09, trail=mirror?2.5:(mode==='rock'?5:3.5);
  for(const p of P){
    if(mirror){
      if(p.type===0){
        const T=TRIS[p.tri],A=SL[T[0]],B=SL[T[1]],C=SL[T[2]];
        tgt.x=A.x*p.bu+B.x*p.bv+C.x*p.bw+Math.sin(t*2+p.ph)*2;
        tgt.y=A.y*p.bu+B.y*p.bv+C.y*p.bw+Math.cos(t*2+p.ph)*2;
        p.tip=false;
      } else {
        const A=SL[p.seg.a],B=SL[p.seg.b],tt=wrap01(p.t0+t*p.flow);
        const dx=B.x-A.x,dy=B.y-A.y,L=Math.hypot(dx,dy)||1;
        const off=p.rad*lastW*(.7+.3*Math.sin(t*2+p.ph));
        tgt.x=A.x+dx*tt+(-dy/L)*off;
        tgt.y=A.y+dy*tt+( dx/L)*off;
        p.tip=p.seg.tip&&tt>.8;
      }
    } else { p.tip=false; target(p,t,tgt); }
    if(!Number.isFinite(p.x)||!Number.isFinite(p.y)){p.x=cx;p.y=cy;}
    p.ox=p.x; p.oy=p.y;
    p.x+=(tgt.x-p.x)*k; p.y+=(tgt.y-p.y)*k;
    const vx=p.x-p.ox,vy=p.y-p.oy;
    ctx.strokeStyle=`hsla(${p.hue},95%,${p.tip?82:62}%,.85)`;
    ctx.lineWidth=p.lw*(p.tip?1.8:1);
    ctx.beginPath();ctx.moveTo(p.x-vx*trail,p.y-vy*trail);ctx.lineTo(p.x,p.y);ctx.stroke();
    ctx.fillStyle=`hsla(${p.hue},95%,70%,.5)`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.lw*.8*(p.tip?1.8:1),0,TAU);ctx.fill(); }

  const label = mirror
    ? '🖐 imitando: '+(gestureName?GN[gestureName]:'procurando sua mão…')
    : LABEL[mode]+(camOK?'':' · sem câmera (demo)');
  if(label!==lastHud){hud.textContent=label;lastHud=label;}
}
requestAnimationFrame(frame);
</script>
</body>
</html>
